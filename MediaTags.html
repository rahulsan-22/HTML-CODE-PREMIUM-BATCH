<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Tags 💖</title>
</head>

<body>
  <!-- Image (Absolute) -->
  <img src="https://images.hindustantimes.com/rf/image_size_630x354/HT/p2/2018/02/09/Pictures/_8ad6ebec-0d56-11e8-9ced-6b0f736beaca.jpg" alt="Anushka" title="Anushka as Devasena" height="700" width="1100">
  <!-- Image (Relative) -->
  <img src="./assets/sweety.jfif" alt="Sweety" title="Anushka in my dreams" height="700" width="400">
  <!-- Audio -->
   <audio src="./assets/audio.mp3" controls autoplay muted loop></audio>
  <!-- Video -->
   <video src="./assets/video.mp4" controls autoplay muted loop poster="./assets/sweety.jfif" height="500" width="1000"></video>
</body>
</html>
