<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Additional Tags 🤗</title>
</head>

<body>
  <!-- <details> and <summary> -->
  <details>
    <summary>Html</summary>
    Hyper Text Markup Language
  </details>
  <hr>
  <!-- <progress> -->
  <progress value="50" max="100"></progress>
  <hr>
  <!-- <meter> -->
  <meter value="10" max="100"></meter>
  <hr>
  <!-- <datalist> -->
  <input type="text" placeholder="Search Movies..." list="movie">
  <datalist id="movie">
    <option>Animal</option>
    <option>Arundhati</option>
    <option>Billa</option>
    <option>Bahubali</option>
    <option>Bahubali 2</option>
    <option>Chatrapathi</option>
    <option>Chandramukhi</option>
  </datalist>
  <hr>
  <!-- <figure> and <figcaption> -->
  <figure>
    <img src="./assets/sweety.jfif" alt="sweety" height="400">
    <figcaption>Anushka Shetty 💖</figcaption>
  </figure>
  <hr>
  <!-- <optgroup> -->
  <label for="food">Food:</label>
  <select id="food">
    <option hidden selected>--Select Food--</option>
    <optgroup label="Veg">
      <option>Grass</option>
      <option>Paneer 65</option>
      <option>Mushroom Biryani</option>
    </optgroup>
    <optgroup label="Non-Veg">
      <option>Chicken Biryani</option>
      <option>Chicken 65</option>
      <option>Chicken Kabab</option>
    </optgroup>
  </select>
</body>

</html>
